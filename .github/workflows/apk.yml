name: Armar APK
on:
  push:
    branches: [main]
    paths: ["web/**", "capacitor.config.json", "package.json"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: Íconos
        run: |
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            cp web/icon-192.png android/app/src/main/res/$d/ic_launcher.png
            cp web/icon-192.png android/app/src/main/res/$d/ic_launcher_round.png
            cp web/icon-maskable-192.png android/app/src/main/res/$d/ic_launcher_foreground.png || true
          done
      - run: npx cap sync android
      - name: Compilar
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Publicar en Releases
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Finanzas.apk
          TAG="v$(date -u +%Y%m%d-%H%M)-${{ github.run_number }}"
          gh release create "$TAG" Finanzas.apk --title "Finanzas $TAG" --notes "APK generado automáticamente. Descargalo desde el celu e instalalo."
