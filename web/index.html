*{box-sizing:border-box}
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;font-family:var(--f-body)}
img{max-width:100%}
[hidden]{display:none!important}
#login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:grid;gap:12px;width:min(380px,100%)}
.login-card input{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.25rem} h3{font-size:1rem}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.2rem;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--f-num);font-size:.72rem;color:var(--muted);font-weight:400}
.spacer{flex:1}
.mep{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted)}
.mep input{width:92px;padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
select.year{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-weight:600}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:10px 14px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;white-space:nowrap;cursor:pointer}
nav.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:20px 96px;display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
main > *{min-width:0}
.banner{background:var(--sunk);border:1px solid var(--line);color:var(--muted);padding:10px 14px;border-radius:var(--r);font-size:.88rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px}
.kpi .lab{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kpi .val{font-family:var(--f-num);font-size:1.45rem;font-weight:500}
.kpi .sub{font-size:.8rem;color:var(--muted)}
.in{color:var(--in)} .out{color:var(--out)} .inv{color:var(--inv)} .muted{color:var(--muted)} .warn{color:var(--warn)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sec-h p{margin:0;color:var(--muted);font-size:.85rem}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{padding:4px 10px;font-size:.84rem}
.btn.danger{color:var(--out)}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pills{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.85rem;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill.empty{color:var(--muted)}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;touch-action:pan-y}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover,.chart .hit.on{fill:color-mix(in srgb,var(--ink) 7%,transparent)}
.tip{position:absolute;z-index:3;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;box-shadow:0 6px 18px rgb(0 0 0 / .14);font-size:.84rem;min-width:180px;display:grid;gap:3px}
.tip[hidden]{display:none}
.tip b{font-family:var(--f-display)}
a{color:var(--accent)}
.tip .l{display:flex;justify-content:space-between;gap:14px}
.tip .l span:last-child{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.bars{display:grid;gap:2px}
.barrow{display:grid;grid-template-columns:minmax(110px,180px) 1fr auto;gap:10px;align-items:center;padding:6px 4px;border-radius:6px;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.barrow:hover{background:var(--sunk)}
.barrow .track{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.barrow .fill{height:100%;background:var(--out);border-radius:5px}
.barrow.subrow{padding-left:22px;font-size:.88rem;cursor:default}
.barrow.subrow .fill{background:color-mix(in srgb,var(--out) 55%,transparent)}
.barrow .amt{font-family:var(--f-num);font-size:.88rem;text-align:right;white-space:nowrap}
.barrow .amt small{color:var(--muted);margin-left:6px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;background:var(--sunk)}
td.r,th.r{text-align:right}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
td.desc{white-space:normal;min-width:160px}
.tag{display:inline-block;font-size:.72rem;padding:1px 7px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.tag.g{background:color-mix(in srgb,var(--out) 14%,transparent);color:var(--out)}
.tag.i{background:color-mix(in srgb,var(--in) 14%,transparent);color:var(--in)}
.tag.h{background:var(--accent-soft);color:var(--accent)}
.tag.v,.tag.r{background:color-mix(in srgb,var(--inv) 14%,transparent);color:var(--inv)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters select{flex:1 1 140px;max-width:100%}
.filters select,.filters input,.field input,.field select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
.filters input{flex:1 1 180px}
.field{display:grid;gap:4px;font-size:.82rem;color:var(--muted)}
.field > input,.field > select{color:var(--ink);font-size:.95rem}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--sunk);padding:4px;border-radius:9px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgb(0 0 0 / .12);font-weight:600}
.sheet-bg{position:fixed;inset:0;background:rgb(10 16 13 / .45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.sheet-bg{align-items:center}}
.sheet{background:var(--surface);width:min(640px,100%);max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:20px max(20px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
@media (min-width:700px){.sheet{border-radius:16px}}
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);padding:14px 20px;font-weight:600;box-shadow:0 6px 18px rgb(0 0 0 / .22);cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;z-index:30;font-size:.9rem;max-width:calc(100% - 32px)}
.acct{display:grid;gap:6px}
.acct .bal{font-family:var(--f-num);font-size:1.2rem}
.acct-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.progress{height:14px;background:var(--sunk);border-radius:7px;overflow:hidden;position:relative}
.progress > div{height:100%;background:var(--inv);border-radius:7px}
.progress .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}
.empty-state{padding:28px 16px;text-align:center;color:var(--muted)}
.ask{background:var(--accent-soft);border-radius:8px;padding:6px 10px;font-size:.84rem;white-space:normal;margin-top:4px}
.quick{display:grid;gap:6px;background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.quick textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;resize:vertical}
.temas{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:10px}
.tema{display:grid;gap:6px;text-align:left;border:2px solid;border-radius:12px;padding:12px;cursor:pointer;font:inherit}
.tema:hover{transform:translateY(-1px)}
.tema-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}

<body>

      <label class="mep" for="mepHoy">MEP hoy $ <input id="mepHoy" class="num" inputmode="decimal" placeholder="1540"></label>

      <button data-tab="inv">Inversiones</button>

  </div>
</header>

<script>
/* ---------- Configuración por defecto ---------- */
const DEF_CATS = {

    "Comida afuera": ["Restaurantes y bares","Delivery","Al paso","Otros"],
    "Hogar": ["Alquiler","Expensas","Luz","Gas","Agua","Internet y cable","Mantenimiento y arreglos","Muebles y deco","Mudanza y fletes","Lavandería"],
    "Salud": ["Obra social","Farmacia","Odontología","Gimnasio","Consultas"],
    "Suscripciones": ["Google","YouTube","HBO","PedidosYa Plus","Antivirus","Celular","Streaming"],
    "Auto": ["Nafta","Peajes","Mantenimiento","Cochera","Seguro","Viajes en auto"],
    "Salidas y ocio": ["Fútbol","Bares y cerveza","Helados","Juegos y apuestas","Viajes","Cine y eventos"],

    "Tarjeta (sin detalle)": ["Visa Nación","Master Nación","Visa Santander"],
    "Otros": ["Sin clasificar"]
  },
  ingreso: {
    "Sueldo": [], "Aguinaldo": [], "Impresiones 3D": [], "Freelance": [], "Dividendos": [], "Reintegros": [], "Intereses": [], "Otros ingresos": []
  }
};
const DEF_CUENTAS = [
  {id:"nacion",nombre:"Banco Nación",tipo:"banco",mon:"ARS"},
  {id:"nacion_usd",nombre:"Banco Nación (dólares)",tipo:"banco",mon:"USD"},
  {id:"efectivo_usd",nombre:"Efectivo (dólares)",tipo:"efectivo",mon:"USD"},
  {id:"uala",nombre:"Ualá",tipo:"billetera",mon:"ARS"},
  {id:"mp",nombre:"Mercado Pago",tipo:"billetera",mon:"ARS"},
  {id:"cuentadni",nombre:"Cuenta DNI",tipo:"billetera",mon:"ARS"},
  {id:"efectivo",nombre:"Efectivo",tipo:"efectivo",mon:"ARS"},
  {id:"bullmarket",nombre:"Bull Market (pesos)",tipo:"broker",mon:"ARS"},
  {id:"bullmarket_usd",nombre:"Bull Market (dólar cable)",tipo:"broker",mon:"USD"},
  {id:"visa_nacion",nombre:"Visa Nación",tipo:"tarjeta",mon:"ARS"},
  {id:"master_nacion",nombre:"Mastercard Nación",tipo:"tarjeta",mon:"ARS"},
  {id:"santander",nombre:"Santander",tipo:"banco",mon:"ARS",arch:true}
];
const TIPOS = {g:"Gasto",i:"Ingreso",h:"Depto",v:"Inversión",r:"Rescate",x:"Transferencia"};
const DEPTO_CATS = ["Cuota","Anticipo","Escritura y gastos","Precancelación","Otros del depto"];
const MES = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const MES_L = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const TIPO_CTA = {banco:"Banco",billetera:"Billetera",efectivo:"Efectivo",broker:"Broker",ahorro:"Ahorro",tarjeta:"Tarjeta de crédito"};
const FONDO="fondo_depto";

/* ---------- Temas ---------- */
const TEMAS={"bosque": {"n": "Bosque", "d": "Verde y petróleo, sobrio", "claro": {"bg": "#F3F5F1", "surface": "#FFFFFF", "sunk": "#E9EDE7", "ink": "#15201A", "muted": "#5D6A62", "line": "#D9DFD8", "accent": "#1D5866", "accent-soft": "#DAE9EC", "on-accent": "#FFFFFF", "in": "#1F7F4F", "out": "#B44A2F", "inv": "#3B57A6", "warn": "#9A5F0E", "warn-soft": "#F4EBDD"}, "oscuro": {"bg": "#0E1411", "surface": "#151D19", "sunk": "#1B2520", "ink": "#E5ECE7", "muted": "#93A198", "line": "#27332D", "accent": "#6FC3CF", "accent-soft": "#183A40", "on-accent": "#0B1410", "in": "#62C98F", "out": "#E5826A", "inv": "#8EA6F2", "warn": "#E0A54A", "warn-soft": "#2E2617"}}, "oceano": {"n": "Océano", "d": "Azul marino y celeste", "claro": {"bg": "#F2F5F8", "surface": "#FFFFFF", "sunk": "#E6ECF2", "ink": "#132030", "muted": "#55667A", "line": "#D5DEE8", "accent": "#1C5A9E", "accent-soft": "#DCE8F6", "on-accent": "#FFFFFF", "in": "#1C7D55", "out": "#B8452F", "inv": "#7A4FB5", "warn": "#9A5F0E", "warn-soft": "#F4EBDD"}, "oscuro": {"bg": "#0D131B", "surface": "#141C27", "sunk": "#1A2431", "ink": "#E3EAF2", "muted": "#93A3B6", "line": "#263243", "accent": "#6FA8EE", "accent-soft": "#1B2C42", "on-accent": "#0B1220", "in": "#5CC596", "out": "#EC8670", "inv": "#B999F2", "warn": "#E0A54A", "warn-soft": "#2E2617"}}, "ciruela": {"n": "Ciruela", "d": "Violeta elegante", "claro": {"bg": "#F6F3F7", "surface": "#FFFFFF", "sunk": "#ECE6EE", "ink": "#21172A", "muted": "#6A5E72", "line": "#E0D8E4", "accent": "#6B3FA0", "accent-soft": "#ECE3F6", "on-accent": "#FFFFFF", "in": "#1E7A52", "out": "#B5432F", "inv": "#2F6DB0", "warn": "#9A5F0E", "warn-soft": "#F4EBDD"}, "oscuro": {"bg": "#140F18", "surface": "#1C1521", "sunk": "#241C2A", "ink": "#ECE4F0", "muted": "#A698AE", "line": "#32283A", "accent": "#B794F0", "accent-soft": "#2E2140", "on-accent": "#160E20", "in": "#5FC394", "out": "#EA8269", "inv": "#7FB0F0", "warn": "#E0A54A", "warn-soft": "#2E2617"}}, "arena": {"n": "Arena", "d": "Cálido, tonos tierra", "claro": {"bg": "#F7F3EE", "surface": "#FFFDFA", "sunk": "#EFE8E0", "ink": "#2A1D16", "muted": "#73645A", "line": "#E4DAD0", "accent": "#5B3E2B", "accent-soft": "#EEE3D8", "on-accent": "#FFFFFF", "in": "#2C7A4B", "out": "#B3363F", "inv": "#3557A8", "warn": "#9A5F0E", "warn-soft": "#F4EBDD"}, "oscuro": {"bg": "#16110D", "surface": "#1E1813", "sunk": "#271F19", "ink": "#EEE5DC", "muted": "#A9998C", "line": "#362B23", "accent": "#D8B48F", "accent-soft": "#3A2C20", "on-accent": "#1A120C", "in": "#69C38F", "out": "#EE7F86", "inv": "#8FA9F0", "warn": "#E0A54A", "warn-soft": "#2E2617"}}, "grafito": {"n": "Grafito", "d": "Neutro, alto contraste", "claro": {"bg": "#F4F4F5", "surface": "#FFFFFF", "sunk": "#E9E9EB", "ink": "#18181B", "muted": "#5F5F68", "line": "#DCDCE0", "accent": "#27272A", "accent-soft": "#E4E4E7", "on-accent": "#FFFFFF", "in": "#1E7A52", "out": "#B44A2F", "inv": "#3B57A6", "warn": "#9A5F0E", "warn-soft": "#F4EBDD"}, "oscuro": {"bg": "#0F0F11", "surface": "#18181B", "sunk": "#202024", "ink": "#EDEDEF", "muted": "#A0A0A9", "line": "#2C2C31", "accent": "#E4E4E7", "accent-soft": "#2A2A2F", "on-accent": "#18181B", "in": "#5FC394", "out": "#E5826A", "inv": "#8EA6F2", "warn": "#E0A54A", "warn-soft": "#2E2617"}}};
function aplicarTema(t){ const r=document.documentElement; const pal=TEMAS[t&&t.paleta]?t.paleta:"bosque"; const modo=["claro","oscuro"].includes(t&&t.modo)?t.modo:"auto";
  r.setAttribute("data-paleta",pal); if(modo==="auto") r.removeAttribute("data-modo"); else r.setAttribute("data-modo",modo);
  try{ localStorage.setItem("fin_tema",JSON.stringify({paleta:pal,modo})); }catch(e){} }
function temaActual(){ const t=(S.cfg&&S.cfg.tema)||(()=>{try{return JSON.parse(localStorage.getItem("fin_tema")||"null")}catch(e){return null}})()||{}; return {paleta:TEMAS[t.paleta]?t.paleta:"bosque",modo:t.modo||"auto"}; }
function modoEfectivo(){ const t=temaActual(); if(t.modo!=="auto") return t.modo; const dt=document.documentElement.getAttribute("data-theme"); if(dt==="dark") return "oscuro"; if(dt==="light") return "claro"; return window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"oscuro":"claro"; }
try{ aplicarTema(JSON.parse(localStorage.getItem("fin_tema")||"null")); }catch(e){ aplicarTema(null); }

/* ---------- Estado ---------- */
let db=null, sample=null, downloads=null, mcp=null, offline=false;
const DRIVE="Google Drive";
const today = new Date();
const S = {
  meses:{}, cfg:null, reglas:{}, cartera:{items:[],snaps:{}},
  loaded:{meses:false,cfg:false},
  year:String(today.getFullYear()), month:today.getMonth()+1,
  tab:"resumen", openCat:null, f:{q:"",tipo:"",cat:"",cta:""},
  imp:null, invEdit:null, vista:"ARS", mercado:null,
  drive:{estado:"idle",files:[],msg:""}, driveCfg:{procesados:{}}, resumenes:{}, verRes:null
};
try{ const v=localStorage.getItem("fin_vista"); if(v==="USD") S.vista="USD"; }catch(e){}
try{ const t=localStorage.getItem("fin_tab"); if(t) S.tab=t; }catch(e){}

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
function fmtN(n,dec){ return (n||0).toLocaleString("es-AR",{minimumFractionDigits:dec,maximumFractionDigits:dec}); }
function usd(n,{sign=false}={}){ const a=Math.abs(n||0); const d=a<100&&a>0?2:0; return (sign&&n>0?"+":"")+(n<0?"−":"")+"US$ "+fmtN(a,d); }
function ars(n){ return (n<0?"−":"")+"$ "+fmtN(Math.abs(n||0),0); }
function arsS(n,{sign=false}={}){ return (sign&&n>0?"+":"")+ars(n); }
function V(n,o){ return S.vista==="USD"?usd(n,o):arsS(n,o); }
function short(v){ const a=Math.abs(v); return a>=1e6?fmtN(v/1e6,a%1e6?1:0)+"M":a>=1e3?fmtN(v/1e3,0)+"k":fmtN(v,0); }
function money(n,mon){ return mon==="USD"?usd(n):ars(n); }
function parseNum(v){ if(typeof v==="number") return v; let s=String(v||"").trim().replace(/\s|\$|US/g,""); if(!s) return NaN;
  if(s.includes(",")) s=s.replace(/\./g,"").replace(",","."); else if((s.match(/\./g)||[]).length>1) s=s.replace(/\./g,"");
  return Number(s); }
function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function ymOf(f){ return String(f).slice(0,7); }
function fechaTxt(f){ if(!f) return ""; if(f.length===7) return MES[+f.slice(5,7)-1]+" (mes)"; const [y,m,d]=f.split("-"); return d+"/"+m; }

function cfg(){
  const c = S.cfg ? clone(S.cfg) : {};
  c.cats = c.cats || clone(DEF_CATS);
  c.cuentas = c.cuentas || clone(DEF_CUENTAS);
  c.metas = c.metas || {};
  c.mep = c.mep || null;
  if(!c.cuentas.some(x=>x.id===FONDO)) c.cuentas.push({id:FONDO,nombre:"Fondo precancelación depto",tipo:"ahorro",mon:"ARS"});
  return c;
}
function cuentas(all){ return cfg().cuentas.filter(c=>all||!c.arch); }
function cuentaNombre(id){ const c=cfg().cuentas.find(x=>x.id===id); return c?c.nombre:(id||"—"); }
function cuentaMon(id){ const c=cfg().cuentas.find(x=>x.id===id); return c?c.mon:"ARS"; }
function mepActual(){ const c=cfg(); const mk=S.mercado&&S.mercado.mep; if(mk&&mk.v&&(!c.mep||!c.mep.v||String(mk.f)>=String(c.mep.f))) return mk.v; if(c.mep&&c.mep.v) return c.mep.v; const ks=Object.keys(S.meses).sort().reverse(); for(const k of ks){ if(S.meses[k].tc) return S.meses[k].tc; } return null; }
function tcMes(ym){ return (S.meses[ym]&&S.meses[ym].tc) || mepActual(); }
function itARS(it){ if(it.mon!=="USD") return it.m; const tc=it.tc||tcMes(ymOf(it.f))||mepActual(); return tc? it.m*tc : 0; }
function itV(it,mon){ return (mon||S.vista)==="USD"? itUSD(it) : itARS(it); }
function itUSD(it){ if(it.mon==="USD") return it.m; const tc=it.tc||tcMes(ymOf(it.f)); return tc? it.m/tc : 0; }
function desdeInicio(list){ const ini=S.cfg&&S.cfg.inicio; return ini? list.filter(i=>String(i.f).padEnd(10,"-")>=ini) : list; }
function items(prefix){ const out=[]; for(const k of Object.keys(S.meses).sort()){ if(k.startsWith(prefix)) for(const it of (S.meses[k].items||[])) out.push(it); } return out; }
function years(){ const ys=new Set(Object.keys(S.meses).map(k=>k.slice(0,4))); const y=today.getFullYear(); ys.add(String(y)); if(today.getMonth()>=9) ys.add(String(y+1)); return [...ys].sort(); }

function toast(msg){ const r=$("#toastRoot"); r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toast.t); toast.t=setTimeout(()=>r.innerHTML="",3200); }

/* ---------- Persistencia ---------- */
const queues={};
function save(path,data){
  if(!db){ toast("Sin conexión a la base: el cambio no se guardó."); return Promise.resolve(); }
  const q=(queues[path]||Promise.resolve()).then(()=>db.doc(path).set(data)).catch(e=>{
    toast(e&&e.code==="quota_exceeded" ? "La base está llena. Borrá datos viejos desde Ajustes." : "No se pudo guardar ("+(e&&e.code||"error")+"). Probá de nuevo.");
  });
  queues[path]=q; return q;
}
function saveMes(ym){ const m=S.meses[ym]; return save("meses/"+ym,{tc:m.tc||null,items:m.items||[]}); }
function saveCfg(c){ S.cfg=c; render(); return save("config/main",c); }
function addItem(it){
  const ym=ymOf(it.f);
  const m = S.meses[ym] ? clone(S.meses[ym]) : {tc: it.tc||mepActual(), items:[]};
  m.items.push(it); m.items.sort((a,b)=>String(a.f).localeCompare(String(b.f)));
  S.meses[ym]=m;
}
function removeItem(id){
  for(const k of Object.keys(S.meses)){ const m=S.meses[k]; const i=(m.items||[]).findIndex(x=>x.id===id); if(i>=0){ const c=clone(m); c.items.splice(i,1); S.meses[k]=c; return k; } }
  return null;
}

/* ---------- Cálculos ---------- */
function resumen(list,mon){
  const r={ing:0,gas:0,inv:0,dep:0,porCat:{},porSub:{},porIng:{}};
  for(const it of list){
    const u=itV(it,mon);
    if(it.t==="i"){ r.ing+=u; r.porIng[it.cat]=(r.porIng[it.cat]||0)+u; }
    else if(it.t==="g"){ r.gas+=u; r.porCat[it.cat]=(r.porCat[it.cat]||0)+u; const k=it.cat+"›"+(it.sub||"—"); r.porSub[k]=(r.porSub[k]||0)+u; }
    else if(it.t==="h"){ if(it.cta!==FONDO) r.dep+=u; }
    else if(it.t==="v"){ r.inv+=u; } else if(it.t==="r"){ r.inv-=u; }
  }
  return r;
}
function saldos(){
  const res={};
  for(const c of cfg().cuentas){ res[c.id]={ini:c.ini||null, bal:{}, mov:0}; if(c.ini) res[c.id].bal[c.mon]=c.ini.m; }
  const all=items("");
  const add=(id,mon,v,f)=>{ const a=res[id]; if(!a) return; if(a.ini && String(f).padEnd(10,"-")<a.ini.f) return; a.bal[mon]=(a.bal[mon]||0)+v; a.mov++; };
  for(const it of all){
    if(it.t==="g") add(it.cta,it.mon,-it.m,it.f);
    else if(it.t==="i") add(it.cta,it.mon,it.m,it.f);
    else { add(it.cta,it.mon,-it.m,it.f); if(it.cta2) add(it.cta2,it.mon2||it.mon,(it.m2!=null?it.m2:it.m),it.f); }
  }
  return res;
}

/* ---------- Render principal ---------- */
let rq=false;
function render(){ if(rq) return; rq=true; requestAnimationFrame(()=>{ rq=false; doRender(); }); }
function doRender(){
  // año
  const ys=years(); if(!ys.includes(S.year)) S.year=ys[ys.length-1];
  $("#yearSel").innerHTML=ys.map(y=>`<option ${y===S.year?"selected":""}>${y}</option>`).join("");
  const mi=$("#mepHoy"); if(document.activeElement!==mi){ const v=cfg().mep; mi.value = v&&v.v ? fmtN(v.v,2) : ""; mi.placeholder = mepActual()?fmtN(mepActual(),0):"1540"; }
  document.querySelectorAll("#vistaSeg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.vista===S.vista)));
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-current",String(b.dataset.tab===S.tab)));
  const main=$("#main");
  if(!S.loaded.meses && !offline){ return; }
  let h="";
  if(offline) h+=`<div class="banner">No hay conexión con la base de datos en esta vista. Podés mirar, pero los cambios no se guardan.</div>`;
  h += ({resumen:vResumen,movs:vMovs,cuentas:vCuentas,inv:vInv,tarjeta:vTarjeta,depto:vDepto,ajustes:vAjustes}[S.tab]||vResumen)();
  const keepScroll=window.scrollY;
  main.innerHTML=h;
  window.scrollTo(0,keepScroll);
  $("#fab").hidden = S.tab==="tarjeta"||S.tab==="ajustes";
}

/* ---------- Vista: Resumen ---------- */
function vResumen(){
  const y=S.year, list=desdeInicio(items(y)), r=resumen(list), ahorro=r.ing-r.gas-r.dep;
  const meta=(cfg().metas[y]||{}).inv||0;

function chartMeses(y){
  const W=720,H=230,pl=48,pr=8,pt=12,pb=28; const iw=W-pl-pr, ih=H-pt-pb;
  const data=MES.map((m,i)=>{ const ym=y+"-"+String(i+1).padStart(2,"0"); const r=resumen(desdeInicio(items(ym))); return {m,ing:r.ing,gas:r.gas,inv:Math.max(0,r.inv),dep:r.dep,ym}; });
  const max=Math.max(1,...data.map(d=>Math.max(d.ing,d.gas,d.inv)));
  const step=niceStep(max/3); const top=Math.ceil(max/step)*step;
  const sy=v=>pt+ih-(v/top)*ih; const gw=iw/12, bw=Math.min(14,(gw-8)/3);
  CH=data;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos, gastos e inversión por mes">`;

  for(let v=0; v<=top+1e-9; v+=step){ s+=`<line x1="${pl}" x2="${W-pr}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${sy(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${short(v)}</text>`; }
  data.forEach((d,i)=>{ const x0=pl+i*gw+(gw-bw*3-4)/2;
    [["ing","var(--in)"],["gas","var(--out)"],["inv","var(--inv)"]].forEach(([k,col],j)=>{ const v=d[k]; if(v>0){ const yy=sy(v); s+=`<rect x="${x0+j*(bw+2)}" y="${yy}" width="${bw}" height="${pt+ih-yy}" rx="2" fill="${col}"><title>${MES_L[i]} · ${k==="ing"?"Ingresos":k==="gas"?"Gastos":"Invertido"}: ${V(v)}</title></rect>`; } });
    s+=`<text x="${pl+i*gw+gw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${d.m}</text>`; });
  data.forEach((d,i)=>{ s+=`<rect class="hit" data-mi="${i}" x="${pl+i*gw+1}" y="${pt}" width="${gw-2}" height="${ih+pb-4}" rx="4"/>`; });
  return s+"</svg>";
}
let CH=null;
function showTip(i,ev){
  const box=$("#chartMeses"), tip=$("#chartTip"); if(!box||!tip||!CH||!CH[i]) return;
  const d=CH[i]; document.querySelectorAll("#chartMeses .hit").forEach(r=>r.classList.toggle("on",+r.dataset.mi===i));
  tip.innerHTML=`<b>${MES_L[i]} ${S.year}</b><div class="l"><span class="in">Ingresos</span><span>${V(d.ing)}</span></div><div class="l"><span class="out">Gastos</span><span>${V(d.gas)}</span></div>${d.dep?`<div class="l"><span style="color:var(--accent)">Depto</span><span>${V(d.dep)}</span></div>`:""}<div class="l"><span class="inv">Invertido</span><span>${V(d.inv)}</span></div><div class="l" style="border-top:1px solid var(--line);padding-top:3px"><span>Neto</span><span>${V(d.ing-d.gas-d.dep,{sign:true})}</span></div>`;
  tip.hidden=false;
  const br=box.getBoundingClientRect(), rr=ev.target.getBoundingClientRect(); const tw=tip.offsetWidth, th=tip.offsetHeight;
  let x=rr.right-br.left+6; if(x+tw>br.width) x=rr.left-br.left-tw-6; x=Math.max(0,x);
  let yy=rr.top-br.top; if(yy+th>br.height) yy=Math.max(0,br.height-th);
  tip.style.left=x+"px"; tip.style.top=yy+"px";
}
function hideTip(){ const t=$("#chartTip"); if(t) t.hidden=true; document.querySelectorAll("#chartMeses .hit.on").forEach(r=>r.classList.remove("on")); }
document.addEventListener("pointerover",ev=>{ const r=ev.target.closest&&ev.target.closest("#chartMeses .hit"); if(r) showTip(+r.dataset.mi,ev); });
document.addEventListener("pointerdown",ev=>{ const r=ev.target.closest&&ev.target.closest("#chartMeses .hit"); if(r) showTip(+r.dataset.mi,ev); else hideTip(); });
document.addEventListener("pointerout",ev=>{ if(ev.target.closest&&ev.target.closest("#chartMeses .hit")&&!(ev.relatedTarget&&ev.relatedTarget.closest&&ev.relatedTarget.closest("#chartMeses .hit"))) hideTip(); });
function niceStep(x){ const p=Math.pow(10,Math.floor(Math.log10(x||1))); const n=x/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }

function cuotasDepto(){ return items("").filter(i=>i.t==="h"&&i.cat==="Cuota").sort((a,b)=>(a.n||0)-(b.n||0)||String(a.f).localeCompare(String(b.f))); }
function proxCuota(){ const c=cuotasDepto(); return c.length? Math.max(...c.map(x=>x.n||0))+1 : 1; }
function depCfg(){ return cfg().depto||{}; }
function uvaDe(it){ if(it.uva) return it.uva; const d=depCfg(); if(it.t==="h"&&it.cat==="Cuota"&&d.cuotaUVA&&it.mon==="ARS") return it.m/d.cuotaUVA; const mk=S.mercado&&S.mercado.uva; return (mk&&mk.v)||d.uvaInicial||null; }
function uvasDe(it){ const u=uvaDe(it); const pesos=it.mon==="USD"?itARS(it):it.m; return u?pesos/u:0; }
function uvaHoy(){ const mk=S.mercado&&S.mercado.uva; if(mk&&mk.v) return mk.v; const c=cuotasDepto(); if(c.length&&depCfg().cuotaUVA) return uvaDe(c[c.length-1]); return depCfg().uvaInicial||null; }

function kDeFecha(f){ const [y,m]=(depCfg().primera||"2026-09").split("-").map(Number); const [fy,fm]=String(f).split("-").map(Number); return (fy-y)*12+(fm-m)+1; }
function fondoUVA(){ let u=0; for(const it of items("")){ if(it.t==="x"&&it.cta2===FONDO) u+=uvasDe(it); if(it.cta===FONDO&&(it.t==="x"||it.t==="h"||it.t==="g")) u-=uvasDe(it); } return u; }
function simular(conPlan){
  const d=depCfg(), p=d.plan||{}; const i=(d.tna||0)/12, cu=d.cuotaUVA, plazo=d.plazo||360; let saldo=d.capitalUVA;
  const nPag=cuotasDepto().length?Math.max(...cuotasDepto().map(x=>x.n||0)):0;
  const prec={}; for(const it of items("")) if(it.t==="h"&&it.cat==="Precancelación"){ const k=kDeFecha(it.f); prec[k]=(prec[k]||0)+uvasDe(it); }
  let fondo=fondoUVA(); const serie=[]; let intTot=0, futCu=0, futPre=0, fin=null, gran=0;
  for(let k=1;k<=plazo&&saldo>1e-6;k++){
    const int=saldo*i, cuota=Math.min(cu,saldo+int), am=cuota-int; saldo-=am; intTot+=int;
    let pre=0;
    if(k<=nPag) pre=prec[k]||0;
    else { if(k>nPag) futCu+=cuota;
      if(conPlan&&p.activo){ if(k<=p.mes&&k%p.frec===0) fondo+=p.aporteUVA; if(k===p.mes){ pre=fondo; gran=Math.min(fondo,saldo); } else if(k>p.mes&&(k-p.mes)%p.frec===0) pre=p.aporteUVA; } }
    pre=Math.min(pre,Math.max(saldo,0)); saldo-=pre; if(k>nPag) futPre+=pre;
    serie.push(Math.max(saldo,0)); if(saldo<=1e-6){ fin=k; break; }
  }
  return {serie,intTot,futCu,futPre,fin:fin||plazo,nPag,gran};
}

/* ---------- Vista: Inversiones ---------- */
function precioPos(p){ const q=S.mercado&&S.mercado.precios&&S.mercado.precios[String(p.ticker).toUpperCase()]; if(q&&q.usd&&(!p.fp||String(q.f)>=String(p.fp))) return {v:q.usd,f:q.f,auto:true,ars:q.ars}; return {v:p.precio||0,f:p.fp,auto:false}; }
function carteraTotales(){ let valor=0,costo=0; for(const p of S.cartera.items||[]){ valor+=(p.cant||0)*precioPos(p).v; costo+=(p.cant||0)*(p.ppc||0); } return {valor,costo,n:(S.cartera.items||[]).length}; }

  const pct = meta? Math.min(100,r.inv/meta*100):0;

  const maxM=Math.max(1,...porMes);

  const cart=carteraTotales(); const res=cart.valor-cart.costo;
  const pos=(S.cartera.items||[]).slice().sort((a,b)=>(b.cant*precioPos(b).v)-(a.cant*precioPos(a).v));
  const ed=S.invEdit;
  const snaps=Object.entries(S.cartera.snaps||{}).sort();
  return `<section class="card">
    <div class="sec-h"><h2>Meta de inversión ${y}</h2>

    <div class="kpis" style="margin-bottom:14px">

      <div class="kpi"><span class="lab">Falta</span><span class="val">${meta?usd(falta):"—"}</span><span class="sub">${meta&&falta&&mesesRest>0?usd(falta/mesesRest)+" por mes en los "+mesesRest+" meses que quedan":""}</span></div>
    </div>
    ${meta?`<div class="progress" aria-label="Avance de la meta"><div style="width:${pct.toFixed(1)}%"></div><span class="mark" style="left:${Math.min(100,ideal/meta*100).toFixed(1)}%" title="Ritmo esperado a hoy"></span></div><p style="margin:8px 0 0;font-size:.88rem">${estado} <span class="muted">La rayita marca dónde deberías estar hoy.</span></p>`:`<p class="muted" style="margin:0">Definí cuánto querés invertir en el año y te muestro si vas en ritmo.</p>`}
    <div style="display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:70px;margin-top:16px">${porMes.map((v,i)=>`<div title="${MES_L[i]}: ${usd(v)}" style="display:grid;gap:3px;align-content:end;height:100%"><div style="height:${Math.max(0,v)/maxM*48}px;background:var(--inv);border-radius:3px 3px 0 0;opacity:${v>0?1:.0}"></div><span style="font-size:.68rem;color:var(--muted);text-align:center">${MES[i]}</span></div>`).join("")}</div>
  </section>
  <section class="card">
    <div class="sec-h"><h2>Cartera en Bull Market</h2><p>${S.mercado&&S.mercado.actualizado?"Precios automáticos actualizados el "+fechaTxt(String(S.mercado.actualizado).slice(0,10))+" (pesos de BYMA ÷ MEP).":"En US$. Los precios se actualizan solos cada día hábil; si falta alguno, cargalo a mano."}</p></div>

    ${imp&&imp.estado==="error"?`<p class="out" style="margin:10px 0 0">${esc(imp.msg)}</p>`:""}`;

function impReview(){

  const dudas=imp.items.map((x,i)=>[x,i]).filter(([x])=>!x.seguro);

function merchantKey(s){ return norm(s).replace(/\b(cuota|cta|c)\s*\d+\s*\/\s*\d+/g,"").replace(/\d{3,}/g,"").replace(/[^a-z0-9*\s]/g," ").replace(/\s+/g," ").trim().split(" ").slice(0,3).join(" "); }

async function pdfToText(file){
  if(!window.pdfjsLib){ await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"); await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"); }
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false}).promise;
  let out=""; const pages=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p); pages.push(page);
    const tc=await page.getTextContent(); const lines={};
    for(const it of tc.items){ if(!it.str) continue; const y=Math.round(it.transform[5]/3)*3; (lines[y]=lines[y]||[]).push(it); }
    out+=`\n--- Página ${p} ---\n`+Object.keys(lines).map(Number).sort((a,b)=>b-a).map(y=>{ const arr=lines[y].sort((a,b)=>a.transform[4]-b.transform[4]); let str="",end=null;
      for(const it of arr){ const x=it.transform[4], h=Math.abs(it.transform[3])||8; if(end!==null){ const gap=x-end; if(gap>h*1.5) str+="   "; else if(gap>h*0.25) str+=" "; } str+=it.str; end=x+(it.width||0); }
      return str.replace(/\s+$/,""); }).filter(Boolean).join("\n");
  }
  return {text:out,pages};
}
async function pagesToImages(pages,max){
  const blobs=[];
  for(const page of pages.slice(0,max)){ const vp=page.getViewport({scale:1.8}); const cv=document.createElement("canvas"); cv.width=vp.width; cv.height=vp.height; await page.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise; blobs.push(await new Promise(r=>cv.toBlob(r,"image/jpeg",0.85))); }
  return blobs;
}

function driveBlock(){
  const d=S.drive, folder=(S.driveCfg&&S.driveCfg.folder)||null;
  if(!mcp) return "";
  let h=`<div style="margin-bottom:16px;display:grid;gap:10px"><div class="row" style="justify-content:space-between"><h3>Desde Google Drive${folder?` · <span class="muted" style="font-weight:400">${esc(folder.nombre)}</span>`:""}</h3><button class="btn sm" data-act="drivescan" ${d.estado==="buscando"?"disabled":""}>${d.estado==="buscando"?'<span class="spin"></span> Buscando…':"Buscar resúmenes"}</button></div>`;
  if(d.estado==="error") h+=`<p class="out" style="margin:0">${esc(d.msg)}</p>`;
  if(d.estado==="ok"){
    const proc=(S.driveCfg&&S.driveCfg.procesados)||{};
    const nuevos=d.files.filter(f=>!proc[f.id]), viejos=d.files.filter(f=>proc[f.id]);
    if(!d.files.length) h+=`<p class="muted" style="margin:0">La carpeta no tiene PDFs.</p>`;
    h+=nuevos.length?`<ul class="list-plain">${nuevos.map(f=>`<li><span>${esc(f.title)} <span class="muted" style="font-size:.8rem">· subido ${fechaTxt(String(f.createdTime||f.modifiedTime||"").slice(0,10))}</span></span><button class="btn pri sm" data-act="driveread" data-id="${esc(f.id)}" ${sample?"":"disabled"}>Leer y categorizar</button></li>`).join("")}</ul>`:(d.files.length?`<p class="muted" style="margin:0">No hay resúmenes nuevos. Todos los de la carpeta ya están cargados.</p>`:"");
    if(viejos.length) h+=`<details><summary class="muted" style="font-weight:500">${viejos.length} ya cargados (no hace falta volver a leerlos)</summary><ul class="list-plain" style="margin-top:6px">${viejos.map(f=>`<li><span class="muted">${esc(f.title)}</span><span class="row" style="gap:6px">${S.resumenes[proc[f.id].rid]?`<button class="btn sm" data-act="resver" data-rid="${esc(proc[f.id].rid)}">Ver</button>`:""}<button class="btn sm" data-act="driveread" data-id="${esc(f.id)}">Volver a leer</button></span></li>`).join("")}</ul></details>`;
  }
  return h+`</div>`;
}
function driveErr(e){
  const c=e&&e.code;
  return {needs_reauth:"Hay que reconectar Google Drive en claude.ai → Configuración → Conectores.",server_not_connected:"Google Drive no está conectado. Agregalo en claude.ai → Configuración → Conectores.",selection_required:"Tenés más de una cuenta de Google Drive conectada: elegí cuál usar cuando claude.ai te lo pregunte.",not_in_manifest:"No le diste permiso a esta página para usar Google Drive. Podés activarlo desde el menú de permisos de la página.",approval_required:"Hace falta que apruebes el acceso a Google Drive. Tocá “Buscar resúmenes” de nuevo.",server_unavailable:"Google Drive no respondió. Probá en un rato.",tool_error:"Google Drive devolvió un error: "+((e&&e.message)||"").slice(0,160)}[c]||("No se pudo leer Google Drive ("+(c||"error")+").");
}
async function driveScan(){
  if(!mcp) return; S.drive={estado:"buscando",files:[],msg:""}; render();
  try{
    let folder=S.driveCfg&&S.driveCfg.folder;
    if(!folder){
      const r=await mcp.callTool(DRIVE,"search_files",{query:"title contains 'Resumenes' and mimeType = 'application/vnd.google-apps.folder'",excludeContentSnippets:true});
      const fs=((r.payload||{}).files)||[]; const f=fs.find(x=>/nacion/i.test(norm(x.title)))||fs[0];
      if(!f) throw {code:"_nofolder"};
      folder={id:f.id,nombre:f.title}; const dc=clone(S.driveCfg||{}); dc.folder=folder; S.driveCfg=dc; save("config/drive",dc);
    }
    const r=await mcp.callTool(DRIVE,"search_files",{query:`parentId = '${folder.id}' and mimeType = 'application/pdf'`,excludeContentSnippets:true,pageSize:50},{cache:false});
    const files=(((r.payload||{}).files)||[]).sort((a,b)=>String(b.createdTime||"").localeCompare(String(a.createdTime||"")));
    S.drive={estado:"ok",files,msg:""};
  }catch(e){ S.drive={estado:"error",files:[],msg: e&&e.code==="_nofolder"?"No encontré la carpeta “Resumenes Nacion” en el Drive conectado. Revisá que esté compartida con esa cuenta.":driveErr(e)}; }
  render();
}
async function driveRead(id){
  S.verRes=null;
  const f=(S.drive.files||[]).find(x=>x.id===id)||{id,title:(Object.values(S.resumenes).find(r=>r.fileId===id)||{}).archivo||"resumen.pdf"};
  S.imp={estado:"leyendo",file:f.title}; render();
  try{
    const r=await mcp.callTool(DRIVE,"download_file_content",{fileId:id},{cache:false});
    const b64=(r.payload&&r.payload.content)||""; if(!b64) throw {code:"tool_error",message:"el archivo vino vacío"};
    const bin=atob(b64); const u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
    const file=new File([u8],f.title.endsWith(".pdf")?f.title:f.title+".pdf",{type:"application/pdf"});
    await procesarResumen(file,id);
  }catch(e){ S.imp={estado:"error",msg:driveErr(e)}; render(); }
}

async function arrancar(fecha){
  const touched=[], borrar=[];
  for(const k of Object.keys(S.meses)){
    const m=S.meses[k]; const keep=(m.items||[]).filter(i=>String(i.f).padEnd(10,"-")>=fecha||i.t==="h");
    if(keep.length===(m.items||[]).length) continue;
    if(keep.length){ S.meses[k]=Object.assign(clone(m),{items:keep}); touched.push(k); } else { delete S.meses[k]; borrar.push(k); }
  }
  const rids=Object.keys(S.resumenes||{}); S.resumenes={};
  const dc=clone(S.driveCfg||{}); dc.procesados={}; S.driveCfg=dc;
  const c=cfg(); c.inicio=fecha; c.metas={}; c.cuentas.forEach(k=>{ delete k.ini; });
  S.confirmArr=false; saveCfg(c);
  for(const k of touched) await saveMes(k);
  if(db){ for(const k of borrar) await db.doc("meses/"+k).delete().catch(()=>{}); for(const r of rids) await db.doc("resumenes/"+r).delete().catch(()=>{}); }
  await save("config/drive",dc);
  S.year=fecha.slice(0,4); S.month=+fecha.slice(5,7);
  toast("Listo: arrancaste el "+fecha.split("-").reverse().join("/")+". Ahora cargá los saldos.");
}

/* ---------- Intérprete de movimientos dictados (sin IA) ---------- */
// Entiende frases como "15 lucas en el súper con Ualá", "ayer cargué nafta 50 mil con la visa",
// "me pagaron 80 mil por una impresión", "pagué 30 dólares en efectivo de Spotify".
function parseLocal(txt, c){
  const raw = String(txt||"").trim();
  const t = " " + norm(raw).replace(/[¿?¡!]/g," ").replace(/\s+/g," ") + " ";
  const has = re => re.test(t);

  // tipo
  let tipo = "g";
  if (has(/ (me pagaron|cobre|cobré|me depositaron|ingreso|ingresaron|sueldo|aguinaldo|vendi|vendí|dividendo|renta|reintegro|me devolvieron|me transfirieron) /)) tipo = "i";
  if (has(/ (cuota( \d+)? del (depto|departamento|credito|prestamo|hipotecario)|hipotecario|hipoteca) /)) tipo = "h";
  if (has(/ (invert[ií]|aporte a bull|pase a bull|pasé a bull|mande a bull|mandé a bull) /)) tipo = "v";
  if (has(/ (retire de bull|retiré de bull|rescate|rescat[eé]) /)) tipo = "r";
  if (has(/ (transferi a|transferí a|pase de|pasé de|movi de|moví de) /) && tipo === "g") tipo = "x";

  // moneda y monto
  const usd = has(/ (dolares|dolar|usd|u\$s|verdes|dolarcitos) /);
  let monto = null, mTxt = "";
  for (const m of t.matchAll(/(\d+(?:[.,]\d+)*)\s*(mil|lucas?|luquitas?|k|palos?|millon(?:es)?)?(?=\s)/g)) {
    let n = m[1];
    if (/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(n)) n = n.replace(/\./g,"").replace(",",".");
    else if (/^\d+,\d+$/.test(n)) n = n.replace(",",".");
    n = parseFloat(n); if (isNaN(n)) continue;
    const mult = m[2] ? (/^(mil|lucas?|luquitas?|k)$/.test(m[2]) ? 1e3 : 1e6) : 1;
    const v = Math.round(n * mult * 100) / 100;
    if (monto === null || v > monto) { monto = v; mTxt = m[0].trim(); }
  }
  if (monto === null && has(/ (un palo|un millon) /)) monto = 1e6;
  if (monto === null && has(/ (una luca) /)) monto = 1000;

  // fecha
  const d = new Date();
  if (has(/ anteayer /)) d.setDate(d.getDate()-2); else if (has(/ ayer /)) d.setDate(d.getDate()-1);
  const fecha = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

  // cuenta
  const ctas = [
    [/ (la visa|visa) /, "visa_nacion"], [/ (la master|master|mastercard) /, "master_nacion"],
    [/ (uala) /, "uala"], [/ (mercado ?pago|mp) /, "mp"], [/ (cuenta dni|dni) /, "cuentadni"],
    [/ (bull ?market|bull) /, usd ? "bullmarket_usd" : "bullmarket"],
    [/ (efectivo|cash|en mano) /, usd ? "efectivo_usd" : "efectivo"],
    [/ (nacion|banco) /, usd ? "nacion_usd" : "nacion"],
  ];
  let cta = usd ? "nacion_usd" : "nacion";
  for (const [re,id] of ctas) if (re.test(t) && !(tipo==="v" && /bull/.test(String(re)))) { cta = id; break; }
  let cta2 = null;
  if (tipo === "v") { cta2 = "bullmarket"; if (cta === "bullmarket") cta = "nacion"; }
  if (tipo === "r") { cta = usd ? "bullmarket_usd" : "bullmarket"; cta2 = "nacion_usd"; }

  // categoría: primero lo aprendido de los resúmenes, después palabras clave
  let cat = null, sub = "";
  if (tipo === "g") {
    for (const [k,v] of Object.entries((typeof S!=="undefined"&&S.reglas)||{})) { if (k.length>3 && t.includes(" "+k.split(" ")[0]+" ")) { cat=v.cat; sub=v.sub; break; } }
    const kw = [
      [/ (super|supermercado|chino|coto|dia|carrefour|disco|jumbo|vea|almacen|coope) /, "Supermercado","Súper y almacén"],
      [/ (verduleria|verdura|carniceria|carne|pollo) /, "Supermercado","Carnicería y verdulería"],
      [/ (fiambre|fiambreria|picada) /, "Supermercado","Fiambrería"],
      [/ (panaderia|facturas|pan) /, "Supermercado","Panadería"],
      [/ (kiosco|golosinas|alfajor) /, "Supermercado","Kiosco"],
      [/ (pedidos ya|pedidosya|rappi|delivery) /, "Comida afuera","Delivery"],
      [/ (restaurante|resto|cena|almuerzo|bar|cerveza|sushi|pizza|parrilla|hamburguesa) /, "Comida afuera","Restaurantes y bares"],
      [/ (cafe|sanguche|empanadas|wrap|mostaza|burger king|mc ?donalds) /, "Comida afuera","Al paso"],
      [/ (nafta|combustible|ypf|shell|axion|cargue nafta|cargué nafta) /, "Auto","Nafta"],
      [/ (peaje|aubasa|telepase) /, "Auto","Peajes"],
      [/ (cochera|estacionamiento) /, "Auto","Cochera"],
      [/ (mecanico|service|gomeria|lavado) /, "Auto","Mantenimiento"],
      [/ (farmacia|remedio|remedios|medicamento) /, "Salud","Farmacia"],
      [/ (obra social|prepaga|osde) /, "Salud","Obra social"],
      [/ (dentista|odontologo) /, "Salud","Odontología"],
      [/ (gimnasio|gym) /, "Salud","Gimnasio"],
      [/ (luz|edelap|edenor|edesur) /, "Hogar","Luz"], [/ (gas|camuzzi|metrogas) /, "Hogar","Gas"], [/ (agua|absa|aysa) /, "Hogar","Agua"],
      [/ (internet|wifi|cablevision|fibertel|telecentro) /, "Hogar","Internet y cable"],
      [/ (expensas) /, "Hogar","Expensas"], [/ (alquiler) /, "Hogar","Alquiler"],
      [/ (ferreteria|pintura|arreglo|plomero|electricista) /, "Hogar","Mantenimiento y arreglos"],
      [/ (netflix|spotify|disney|max|hbo) /, "Suscripciones","Streaming"], [/ (youtube) /, "Suscripciones","YouTube"], [/ (google|drive) /, "Suscripciones","Google"],
      [/ (celular|personal|claro|movistar) /, "Suscripciones","Celular"],
      [/ (futbol|fulbo) /, "Salidas y ocio","Fútbol"], [/ (helado|heladeria) /, "Salidas y ocio","Helados"], [/ (cine|teatro|recital|entrada) /, "Salidas y ocio","Cine y eventos"],
      [/ (viaje|vacaciones|pasaje|hotel) /, "Salidas y ocio","Viajes"],
      [/ (regalo) /, "Regalos y eventos","Regalos"], [/ (cumple|cumpleanos) /, "Regalos y eventos","Cumpleaños"],
      [/ (ropa|zapatillas|remera|pantalon) /, "Personal","Ropa"], [/ (peluqueria|corte de pelo|barberia) /, "Personal","Peluquería"], [/ (libro) /, "Personal","Libros"],
      [/ (filamento|filamentos) /, "Hobby 3D","Filamentos"], [/ (impresora|repuesto) /, "Hobby 3D","Repuestos"],
      [/ (comision|mantenimiento de cuenta) /, "Bancos y trámites","Comisiones bancarias"],
    ];
    if (!cat) for (const [re,c1,s1] of kw) if (re.test(t)) { cat=c1; sub=s1; break; }
    const tree = c.cats.gasto;
    if (!cat || !tree[cat]) { cat = "Otros"; sub = "Sin clasificar"; }
    if (!(tree[cat]||[]).includes(sub)) sub = (tree[cat]||[])[0] || "";
  } else if (tipo === "i") {
    const ki = [[/ (sueldo) /,"Sueldo"],[/ (aguinaldo) /,"Aguinaldo"],[/ (impresion|impresiones|llavero|3d) /,"Impresiones 3D"],[/ (freelance|trabajo|proyecto) /,"Freelance"],[/ (dividendo) /,"Dividendos"],[/ (renta) /,"Rentas de bonos"],[/ (reintegro|devolvieron) /,"Reintegros"],[/ (interes|intereses|rendimiento) /,"Intereses"],[/ (premio|bono) /,"Premio laboral"]];
    cat = "Otros ingresos"; for (const [re,k] of ki) if (re.test(t) && c.cats.ingreso[k]) { cat=k; break; }
  } else if (tipo === "h") { cat = "Cuota"; }

  // descripción: lo que se dijo, sin el monto
  let d2 = raw.replace(new RegExp(mTxt.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"i"), "").replace(/\s+/g," ").trim();
  d2 = d2.replace(/^(gaste|gasté|pague|pagué|compre|compré)\s+/i,"");
  d2 = d2.charAt(0).toUpperCase() + d2.slice(1);

  return { t: tipo, f: fecha, m: monto, mon: usd ? "USD" : "ARS", cta, cta2, cat, sub, d: d2.slice(0,80) };
}

/* ---------- Arranque (Supabase) ---------- */
let USER_MAIL="", SB=null, RT=null;

// Misma interfaz de documentos que usaba la web en claude.ai, guardada en la tabla public.docs
function makeDb(uid){
  const cache={}, loading={}, listeners=[];
  const fire=l=>{ const c=cache[l.col]||{}; try{
      if(l.id==null) l.cb({docs:Object.entries(c).map(([id,d])=>({id,exists:true,data:()=>d}))});
      else { const d=c[l.id]; l.cb({id:l.id,exists:d!==undefined,data:()=>d}); }
    }catch(e){ console.error(e); } };
  const emit=col=>listeners.filter(l=>l.col===col).forEach(fire);
  const load=col=>loading[col]||(loading[col]=(async()=>{
    const {data,error}=await SB.from("docs").select("id,data").eq("col",col);
    if(error){ loading[col]=null; throw error; }
    cache[col]={}; (data||[]).forEach(r=>{ cache[col][r.id]=r.data; }); emit(col);
  })());
  const split=p=>{ const i=p.indexOf("/"); return [p.slice(0,i),p.slice(i+1)]; };
  RT=SB.channel("docs-"+uid)
    .on("postgres_changes",{event:"*",schema:"public",table:"docs",filter:"user_id=eq."+uid},p=>{
      const r=(p.new&&p.new.col)?p.new:p.old; if(!r||!r.col) return;
      cache[r.col]=cache[r.col]||{};
      if(p.eventType==="DELETE") delete cache[r.col][r.id]; else cache[r.col][r.id]=p.new.data;
      emit(r.col);
    }).subscribe();
  const err=e=>({code:(e&&e.code==="42501")?"revoked":"unavailable",message:e&&e.message});
  const sub=(col,id,cb,onErr)=>{ const l={col,id,cb}; listeners.push(l); load(col).then(()=>fire(l)).catch(e=>onErr&&onErr(err(e))); return ()=>{ const i=listeners.indexOf(l); if(i>=0) listeners.splice(i,1); }; };
  return {
    collection(col){ return { onSnapshot(cb,onErr){ return sub(col,null,cb,onErr); } }; },
    doc(path){ const [col,id]=split(path); return {
      onSnapshot(cb,onErr){ return sub(col,id,cb,onErr); },
      async set(data){
        cache[col]=cache[col]||{}; cache[col][id]=JSON.parse(JSON.stringify(data)); emit(col);
        const {error}=await SB.from("docs").upsert({user_id:uid,col,id,data},{onConflict:"user_id,col,id"});
        if(error) throw err(error);
      },
      async delete(){
        if(cache[col]) delete cache[col][id]; emit(col);
        const {error}=await SB.from("docs").delete().eq("col",col).eq("id",id);
        if(error) throw err(error);
      }
    }; }
  };
}

// Descargas: en el celu usa "Compartir" (guardar en Drive, mandar por mail…); en la compu, descarga normal
const localDownloads={ async save({filename,data}){
  const blob=data instanceof Blob?data:new Blob([data],{type:filename.endsWith(".csv")?"text/csv":"application/json"});
  try{ const file=new File([blob],filename,{type:blob.type});
    if(navigator.canShare&&navigator.canShare({files:[file]})&&/Android|iPhone|iPad/i.test(navigator.userAgent)){ await navigator.share({files:[file],title:filename}); return; }
  }catch(e){ if(e&&e.name==="AbortError") return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
} };

async function iniciarApp(session){
  USER_MAIL=session.user.email||""; $("#login").hidden=true; $("#app").hidden=false;
  downloads=localDownloads; db=makeDb(session.user.id); mfaCargar();
  render();
  const onErr=e=>{ if(e&&e.code==="revoked"){ offline=true; render(); } else toast("No se pudo leer la base de datos. Revisá tu conexión."); };
  db.collection("meses").onSnapshot(snap=>{ const m={}; snap.docs.forEach(d=>{ m[d.id]=d.data(); }); S.meses=m; S.loaded.meses=true;
    if(!S._init){ S._init=true; const ks=Object.keys(m).sort(); const cy=String(today.getFullYear()); if(!ks.some(k=>k.startsWith(cy))&&ks.length){ S.year=ks[ks.length-1].slice(0,4); } }
    render(); if(!APP_LISTA){ APP_LISTA=true; setTimeout(ejecutarLink,50); } }, onErr);
  db.doc("config/main").onSnapshot(d=>{ S.cfg=d.exists?d.data():null; S.loaded.cfg=true; if(S.cfg&&S.cfg.tema) aplicarTema(S.cfg.tema); render(); }, onErr);
  db.doc("config/reglas").onSnapshot(d=>{ S.reglas=d.exists?(d.data().map||{}):{}; render(); }, onErr);
  db.doc("config/mercado").onSnapshot(d=>{ S.mercado=d.exists?d.data():null; render(); }, onErr);
  db.collection("resumenes").onSnapshot(snap=>{ const m={}; snap.docs.forEach(d=>{ const v=d.data(); if(v&&Array.isArray(v.lineas)) m[d.id]=v; }); S.resumenes=m; render(); }, onErr);
  db.doc("config/drive").onSnapshot(d=>{ S.driveCfg=d.exists?d.data():{procesados:{}}; render(); }, onErr);
  db.doc("config/cartera").onSnapshot(d=>{ S.cartera=d.exists?d.data():{items:[],snaps:{}}; render(); }, onErr);
}


/* ---------- Verificación en dos pasos (TOTP) ---------- */
S.mfa={factors:null,enroll:null,msg:"",busy:false};
async function mfaCargar(){ const {data,error}=await SB.auth.mfa.listFactors(); if(error) return; S.mfa.factors=(data.totp||[]).filter(f=>f.status==="verified"); render(); }
function mfaBlock(){
  const m=S.mfa; const fs=m.factors;
  let h=`<section class="card"><div class="sec-h"><h2>Verificación en dos pasos</h2><p>Además de la contraseña, un código de 6 números de una app en tu celu</p></div>`;
  if(fs===null) return h+`<p class="muted" style="margin:0">Cargando…</p></section>`;
  if(m.enroll){
    h+=`<ol style="margin:0;padding-left:20px;display:grid;gap:10px">
      <li>Instalá en el celu <b>Google Authenticator</b>, <b>Microsoft Authenticator</b> o <b>Authy</b> (cualquiera sirve).</li>
      <li>En esa app, tocá “Agregar” y escaneá este código:<div style="background:#fff;padding:10px;border-radius:10px;width:max-content;max-width:100%;margin-top:8px"><img src="${m.enroll.qr}" alt="Código QR para la app de autenticación" width="180" height="180"></div>
        <span class="muted" style="font-size:.84rem">Si estás en el mismo celu y no podés escanear, cargá esta clave a mano: <code style="user-select:all;word-break:break-all">${esc(m.enroll.secret)}</code></span></li>
      <li>Escribí el código de 6 números que te muestra la app:<form id="mfaEnrollForm" class="row" style="margin-top:6px"><input id="mfaEnrollCode" class="num" inputmode="numeric" autocomplete="one-time-code" maxlength="6" style="width:120px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)"><button class="btn pri" type="submit" ${m.busy?"disabled":""}>Activar</button><button class="btn" type="button" data-act="mfacancel">Cancelar</button></form></li></ol>`;
  } else if(fs.length){
    h+=`<p style="margin:0 0 10px"><span class="in">● Activada</span> en ${fs.length} ${fs.length===1?"dispositivo":"dispositivos"}: ${fs.map(f=>esc(f.friendly_name||"app")).join(", ")}.</p>
      ${fs.length===1?`<p class="muted" style="margin:0 0 10px;font-size:.86rem">Te recomiendo agregar un segundo dispositivo de respaldo (otro celu, o la misma clave en otra app). Supabase no da códigos de recuperación: si perdés el único, hay que sacarlo desde el panel de Supabase.</p>`:""}
      <div class="row"><button class="btn" data-act="mfaadd">Agregar otro dispositivo</button>${fs.map(f=>`<button class="btn danger sm" data-act="mfadel" data-id="${f.id}">${S.mfaConfirm===f.id?"Tocá de nuevo para quitar":"Quitar "+esc(f.friendly_name||"app")}</button>`).join("")}</div>`;
  } else {
    h+=`<p class="muted" style="margin:0 0 10px">Está desactivada. Si alguien consiguiera tu contraseña, igual no podría entrar sin el código de tu celu.</p><button class="btn pri" data-act="mfaadd">Activar verificación en dos pasos</button>`;
  }
  if(m.msg) h+=`<p class="out" style="margin:10px 0 0">${esc(m.msg)}</p>`;
  return h+`</section>`;
}
async function mfaEmpezar(){
  S.mfa.msg="";
  const {data:lst}=await SB.auth.mfa.listFactors();
  for(const f of ((lst&&lst.all)||[]).filter(f=>f.status!=="verified")){ await SB.auth.mfa.unenroll({factorId:f.id}).catch(()=>{}); }
  const n=((lst&&lst.totp)||[]).filter(f=>f.status==="verified").length;
  const {data,error}=await SB.auth.mfa.enroll({factorType:"totp",friendlyName:n?"Respaldo "+(n+1):"Celular",issuer:"Finanzas"});
  if(error){ S.mfa.msg="No se pudo empezar: "+error.message; render(); return; }
  const q=data.totp.qr_code||""; S.mfa.enroll={id:data.id,qr:q.startsWith("data:")?q:"data:image/svg+xml;utf-8,"+encodeURIComponent(q),secret:data.totp.secret}; render();
}
async function mfaConfirmar(code){
  S.mfa.busy=true; S.mfa.msg=""; render();
  const {error}=await SB.auth.mfa.challengeAndVerify({factorId:S.mfa.enroll.id,code});
  S.mfa.busy=false;
  if(error){ S.mfa.msg="El código no coincide. Revisá que sea el de Finanzas y que la hora del celu esté bien."; render(); return; }
  S.mfa.enroll=null; toast("Verificación en dos pasos activada"); await mfaCargar();
}
document.addEventListener("submit",ev=>{ if(ev.target.id!=="mfaEnrollForm") return; ev.preventDefault(); const c=(document.getElementById("mfaEnrollCode").value||"").replace(/\D/g,""); if(c.length===6) mfaConfirmar(c); });
document.addEventListener("click",async ev=>{ const el=ev.target.closest&&ev.target.closest("[data-act]"); if(!el) return; const a=el.dataset.act;
  if(a==="mfaadd") mfaEmpezar();
  else if(a==="mfacancel"){ const id=S.mfa.enroll&&S.mfa.enroll.id; S.mfa.enroll=null; render(); if(id) SB.auth.mfa.unenroll({factorId:id}).catch(()=>{}); }
  else if(a==="mfadel"){ if(S.mfaConfirm!==el.dataset.id){ S.mfaConfirm=el.dataset.id; render(); return; } S.mfaConfirm=null; const {error}=await SB.auth.mfa.unenroll({factorId:el.dataset.id}); if(error) toast("No se pudo quitar: "+error.message); else { await SB.auth.refreshSession().catch(()=>{}); toast("Dispositivo quitado"); } mfaCargar(); }
});
// Después de la contraseña: si tiene 2FA, pedir el código antes de abrir la app
async function pasoMfa(session){
  const {data}=await SB.auth.mfa.getAuthenticatorAssuranceLevel();
  if(data&&data.nextLevel==="aal2"&&data.currentLevel!=="aal2"){
    $("#login").hidden=false; $("#loginForm").hidden=true; $("#mfaForm").hidden=false; $("#mfaCode").value=""; $("#mfaCode").focus(); return;
  }
  iniciarApp(session);
}


/* ---------- Widget del celu y dictado ---------- */
let APP_LISTA=false, LINK_PEND=null;
function manejarLink(url){ LINK_PEND=url; if(APP_LISTA) ejecutarLink(); }
function ejecutarLink(){ const u=LINK_PEND; LINK_PEND=null; if(!u) return;
  if(/\/\/(voz|nuevo)/.test(u)){ S.tab="movs"; try{localStorage.setItem("fin_tab","movs")}catch(e){} S.year=String(today.getFullYear()); S.month=today.getMonth()+1; render(); closeForm(); openForm(null);
    const m=u.match(/[?&]t=([^&]*)/); const dicho=m?decodeURIComponent(m[1].replace(/\+/g," ")):"";
    if(dicho){ F._q=dicho; drawForm(); quickParse(); }   // ya se grabó desde el widget: completar y confirmar
    else if(/\/\/voz/.test(u)) dictar(); } }
async function dictar(){
  if(!document.getElementById("movForm")) openForm(null);
  readForm(); F._qmsg="Escuchando… hablá cuando aparezca el micrófono"; drawForm();
  try{ const txt=await NATIVO.voz();
    if(!txt){ F._qmsg="No te escuché. Tocá Dictar y probá de nuevo."; drawForm(); return; }
    F._q=txt; F._qmsg=""; drawForm(); await quickParse();
  }catch(e){ F._qmsg = e&&e.message==="permiso" ? "Necesito permiso para usar el micrófono (Ajustes del celu → Apps → Finanzas → Permisos)." : "No se pudo usar el micrófono en este dispositivo."; drawForm(); }
}
document.addEventListener("click",ev=>{ const el=ev.target.closest&&ev.target.closest("[data-act=qvoz]"); if(el&&F&&!F._qbusy) dictar(); });
if(window.NATIVO) NATIVO.onLink(manejarLink);

async function importarRespaldo(){
  const docs=S.impB&&S.impB.docs; if(!docs) return; S.impB=null; render(); toast("Importando…");
  const rows=Object.entries(docs).map(([p,data])=>{ const i=p.indexOf("/"); return {col:p.slice(0,i),id:p.slice(i+1),data}; })
    .filter(r=>r.col&&r.id&&r.data&&typeof r.data==="object");
  let ok=0; for(const r of rows){ try{ await db.doc(r.col+"/"+r.id).set(r.data); ok++; }catch(e){} }
  toast(`Importados ${ok} de ${rows.length} documentos`);
}
document.addEventListener("change",async ev=>{ const t=ev.target; if(t.id!=="impBackup"||!t.files||!t.files[0]) return;
  try{ const j=JSON.parse(await t.files[0].text()); let docs=j&&j.docs;
    if(!docs&&j&&j.meses){ docs={}; for(const [k,v] of Object.entries(j.meses)) docs["meses/"+k]=v; if(j.config) docs["config/main"]=j.config; if(j.reglas) docs["config/reglas"]={map:j.reglas}; if(j.cartera) docs["config/cartera"]=j.cartera; }
    if(!docs||!Object.keys(docs).length) throw 0;
    const cols={}; Object.keys(docs).forEach(p=>{ const c=p.split("/")[0]; cols[c]=(cols[c]||0)+1; });
    S.impB={docs,n:Object.keys(docs).length,resumen:Object.entries(cols).map(([c,n])=>`${n} ${c}`).join(", ")}; render();
  }catch(e){ toast("Ese archivo no parece un respaldo de Finanzas."); }
  t.value=""; });
document.addEventListener("click",async ev=>{ const el=ev.target.closest&&ev.target.closest("[data-act]"); if(!el) return; const a=el.dataset.act;
  if(a==="impbsi") importarRespaldo();
  else if(a==="impbno"){ S.impB=null; render(); }
  else if(a==="logout"){ try{ RT&&SB.removeChannel(RT); }catch(e){} await SB.auth.signOut(); location.reload(); } });

(async()=>{
  const C=window.FINANZAS_CONFIG||{};
  if(!window.supabase||!C.url||!C.anonKey){ $("#login").hidden=false; $("#lgErr").textContent="Falta configurar la conexión con Supabase (config.js)."; return; }
  SB=window.supabase.createClient(C.url,C.anonKey,{auth:{persistSession:true,autoRefreshToken:true,storageKey:"finanzas-auth"}});
  const {data:{session}}=await SB.auth.getSession();
  if(session) pasoMfa(session); else $("#login").hidden=false;
  $("#loginForm").addEventListener("submit",async ev=>{ ev.preventDefault(); const b=$("#lgBtn"); b.disabled=true; $("#lgErr").textContent="";
    const {data,error}=await SB.auth.signInWithPassword({email:$("#lgMail").value.trim(),password:$("#lgPass").value});
    b.disabled=false;
    if(error){ $("#lgErr").textContent=/invalid/i.test(error.message)?"Mail o contraseña incorrectos.":"No se pudo entrar: "+error.message; return; }
    pasoMfa(data.session); });
  $("#mfaForm").addEventListener("submit",async ev=>{ ev.preventDefault(); const b=$("#mfaBtn"); const code=($("#mfaCode").value||"").replace(/\D/g,""); if(code.length!==6){ $("#mfaErr").textContent="Son 6 números."; return; } b.disabled=true; $("#mfaErr").textContent="";
    const {data:lf}=await SB.auth.mfa.listFactors(); const f=((lf&&lf.totp)||[]).find(x=>x.status==="verified");
    const {error}=f?await SB.auth.mfa.challengeAndVerify({factorId:f.id,code}):{error:{message:"sin factor"}};
    b.disabled=false; if(error){ $("#mfaErr").textContent="Código incorrecto. Probá con el siguiente que muestre la app."; return; }
    const {data:{session}}=await SB.auth.getSession(); $("#mfaForm").hidden=true; $("#loginForm").hidden=false; iniciarApp(session); });
  $("#mfaSalir").addEventListener("click",async()=>{ await SB.auth.signOut(); location.reload(); });
  if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
